name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  DATABASE_URL: postgresql://gestoria:gestoria@localhost:5432/gestoria_test
  DIRECT_URL: postgresql://gestoria:gestoria@localhost:5432/gestoria_test
  TEST_DATABASE_URL: postgresql://gestoria:gestoria@localhost:5432/gestoria_test
  REDIS_URL: redis://localhost:6379
  AUTH_SECRET: ci-secret-ci-secret-ci-secret-ci-secret
  APP_DOMAIN: localhost:3000
  S3_ENDPOINT: http://localhost:9000
  S3_REGION: us-east-1
  S3_BUCKET: gestoria
  S3_ACCESS_KEY_ID: minioadmin
  S3_SECRET_ACCESS_KEY: minioadmin

jobs:
  quality:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: gestoria
          POSTGRES_PASSWORD: gestoria
          POSTGRES_DB: gestoria_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U gestoria" --health-interval 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  e2e:
    runs-on: ubuntu-latest
    needs: quality
    env:
      DATABASE_URL: postgresql://gestoria:gestoria@localhost:5432/gestoria_test
      DIRECT_URL: postgresql://gestoria:gestoria@localhost:5432/gestoria_test
      DEMO_MODE: 'true'
      CI: 'true'
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: gestoria
          POSTGRES_PASSWORD: gestoria
          POSTGRES_DB: gestoria_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U gestoria" --health-interval 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # Service containers cannot take a command, and MinIO needs one.
      - name: Start MinIO and create the bucket
        run: |
          docker run -d --name minio --network host -e MINIO_ROOT_USER=minioadmin -e MINIO_ROOT_PASSWORD=minioadmin quay.io/minio/minio server /data
          for i in $(seq 1 30); do curl -sf http://localhost:9000/minio/health/live && break; sleep 1; done
          docker run --rm --network host --entrypoint /bin/sh quay.io/minio/mc -c "mc alias set local http://localhost:9000 minioadmin minioadmin && mc mb --ignore-existing local/gestoria"
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npx prisma migrate deploy
      - run: npm run build
      - run: npm run test:e2e
      # §9: performance >= 90 and accessibility >= 95 on the client's screens, on the same build.
      - name: Lighthouse on the client screens
        run: |
          npm run db:seed
          npm run start &
          for i in $(seq 1 30); do curl -sf http://localhost:3000/api/health && break; sleep 1; done
          npm run lighthouse
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
