name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  DATABASE_URL: postgresql://gestoria:gestoria@localhost:5432/gestoria_test
  DIRECT_URL: postgresql://gestoria:gestoria@localhost:5432/gestoria_test
  TEST_DATABASE_URL: postgresql://gestoria:gestoria@localhost:5432/gestoria_test
  REDIS_URL: redis://localhost:6379
  AUTH_SECRET: ci-secret-ci-secret-ci-secret-ci-secret
  APP_DOMAIN: localhost:3000
  S3_ENDPOINT: http://localhost:9000
  S3_REGION: us-east-1
  S3_BUCKET: gestoria
  S3_ACCESS_KEY_ID: minioadmin
  S3_SECRET_ACCESS_KEY: minioadmin

jobs:
  quality:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: gestoria
          POSTGRES_PASSWORD: gestoria
          POSTGRES_DB: gestoria_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U gestoria" --health-interval 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  # Playwright flows arrive in phase 3; the job exists so branch protection can already require it.
  e2e:
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test:e2e
